<title>Buble Lumi 3D</title>
<style>
/* Layout: scenă 3D pe tot ecranul, titlu sus, comutator și legendă jos. Paletă din identitatea Buble. */
:root{--indigo:#150f55;--violet:#6d3fc0;--lilac:#d9ccff;--teal:#2bd4c8;--gold:#f6c445;--ink:#2a1766;--paper:#ffffff;--panel:rgba(21,15,85,.72);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--indigo);color:var(--paper);font:600 15px/1.35 Nunito,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;text-shadow:0 2px 10px rgba(10,6,50,.55)}
.top b{display:block;font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1}
.top span{display:block;margin-top:4px;font-size:13px;font-weight:700;opacity:.92}
.top em{display:inline-block;margin-top:8px;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(21,15,85,.55);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 9px}
.dock{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.cap{margin:0;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:11px 14px;font-size:14px;font-weight:600;min-height:3.9em}
.cap b{color:var(--gold);font-weight:800}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-width:0;font:inherit;color:var(--paper);background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.22);border-radius:18px;padding:10px 8px;cursor:pointer;text-align:center;line-height:1.2}
.seg button strong{display:block;font-size:15px;font-weight:800}
.seg button small{display:block;margin-top:2px;font-size:11px;font-weight:600;opacity:.8}
.seg button[aria-pressed="true"]{background:linear-gradient(#ffe38a,var(--gold));color:var(--ink);border-color:#fff3c6;box-shadow:0 3px 0 #b57400,0 6px 16px rgba(0,0,0,.35)}
.seg button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--indigo);font-size:16px}
@media (prefers-reduced-motion:reduce){.seg button{transition:none}}
</style>

<canvas id="c" aria-label="Scenă 3D interactivă"></canvas>
<header class="top"><b>Buble</b><span>Două direcții pentru lumea jocului</span><em>Schiță 3D din cod, nu randarea finală</em></header>
<section class="dock">
<p class="cap" id="cap"></p>
<div class="seg" role="group" aria-label="Alege direcția">
<button id="bA" aria-pressed="true"><strong>Orașul din bulă</strong><small>Amurg, glob de sticlă</small></button>
<button id="bB" aria-pressed="false"><strong>Dirijabilul-oraș</strong><small>Zi însorită, secțiune</small></button>
</div>
</section>
<div id="err" hidden>Acest browser nu poate afișa scene 3D. Încearcă din Chrome pe telefon.</div>

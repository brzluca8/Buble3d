<title>Buble Mascota</title>
<style>
/* Layout: mascota pe un piedestal, pe tot ecranul; titlu sus, legendă, acțiuni și variante jos. Paletă Buble. */
:root{--indigo:#150f55;--violet:#6d3fc0;--lilac:#d9ccff;--teal:#2bd4c8;--gold:#f6c445;--ink:#2a1766;--paper:#ffffff;--panel:rgba(21,15,85,.72);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--indigo);color:var(--paper);font:600 15px/1.35 Nunito,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;text-shadow:0 2px 10px rgba(10,6,50,.55)}
.top b{display:block;font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1}
.top span{display:block;margin-top:4px;font-size:13px;font-weight:700;opacity:.92}
.top em{display:inline-block;margin-top:8px;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(21,15,85,.55);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 9px}
.dock{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.cap{margin:0;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:11px 14px;font-size:14px;font-weight:600;min-height:4.8em}
.cap b{color:var(--gold);font-weight:800}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1 1 auto;min-width:0;font:inherit;font-size:13px;font-weight:800;color:var(--paper);background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.28);border-radius:14px;padding:9px 10px;cursor:pointer}
.acts button[aria-pressed="true"]{background:var(--teal);color:var(--ink);border-color:#c8fff9}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-width:0;font:inherit;color:var(--paper);background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.22);border-radius:18px;padding:10px 6px;cursor:pointer;text-align:center;line-height:1.2}
.seg button strong{display:block;font-size:14px;font-weight:800}
.seg button small{display:block;margin-top:2px;font-size:11px;font-weight:600;opacity:.8}
.seg button[aria-pressed="true"]{background:linear-gradient(#ffe38a,var(--gold));color:var(--ink);border-color:#fff3c6;box-shadow:0 3px 0 #b57400,0 6px 16px rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--indigo);font-size:16px}
</style>

<canvas id="c" aria-label="Mascota Buble în 3D"></canvas>
<header class="top"><b>Buble</b><span>Trei variante pentru mascotă</span><em>Schiță 3D din cod, nu randarea finală</em></header>
<section class="dock">
<p class="cap" id="cap"></p>
<div class="acts"><button id="aW">Salut</button><button id="aJ">Bucurie</button><button id="aP">Pop</button><button id="aS" aria-pressed="false">Mărime în joc</button></div>
<div class="seg" role="group" aria-label="Alege varianta">
<button id="v0" aria-pressed="false"><strong>Din randare</strong><small>Ochelari de aviator</small></button>
<button id="v1" aria-pressed="false"><strong>Cască de bulă</strong><small>Același corp</small></button>
<button id="v2" aria-pressed="true"><strong>Bulă vie</strong><small>Miez luminos</small></button>
</div>
</section>
<div id="err" hidden>Acest browser nu poate afișa scene 3D. Încearcă din Chrome pe telefon.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

/* ---------- utilitare ---------- */

 for(var i=0;i<120;i++){x.fillStyle='rgba(255,255,255,'+rr(.25,.9)+')';x.beginPath();x.arc(rr(0,w),rr(0,h*.6),rr(.4,1.4),0,7);x.fill()}});

/* ---------- părți comune ---------- */
function eyePair(g,y,z,sx,r,eyes){[-1,1].forEach(function(s){var e=new THREE.Group();e.position.set(s*sx,y,z);add(e,sph(r,12,10),dark);add(e,sph(r*.34,6,6),hl,-s*r*.25,r*.42,r*.8);add(e,sph(r*.17,6,6),hl,s*r*.3,-r*.3,r*.9);g.add(e);eyes.push(e)})}

/* ---------- varianta 0: din randare ---------- */
function mkOrig(){var g=new THREE.Group(),eyes=[];body(g,white);eyePair(g,.84,.58,.23,.1,eyes);cheeksFeet(g,white);

 flat(add(g,tor(.56,.11),vio,0,.46,0));add(g,bx(.2,.5,.08),vio,.34,.28,.56).rotation.z=.3;var lf=add(g,sph(.07,8,8),gold,0,.4,.66);lf.scale.set(1,1,.3);
 add(g,bx(.5,.55,.25),wood,0,.62,-.64);

 var sm=add(g,new THREE.TorusGeometry(.11,.025,6,14,Math.PI),mouthM,0,.76,.6);sm.rotation.z=Math.PI;sm.castShadow=false;
 [-1,1].forEach(function(s){glow(g,s*.42,.8,.5,.4,0xff9fc8,.55);var f=add(g,sph(.2,10,8),M(0xf4eaff,{roughness:.3}),s*.3,.1,.1);f.scale.set(1,.6,1.1)});
 flat(add(g,tor(.55,.09),vio,0,.36,0));

/* ---------- scena ---------- */
var S=new THREE.Scene();S.background=skyT;
S.add(new THREE.HemisphereLight(0xa8c8ff,0x7a46c0,.95));
var key=new THREE.DirectionalLight(0xffe6c0,1.7);key.position.set(4,8,6);key.castShadow=true;key.shadow.mapSize.set(1024,1024);var sc=key.shadow.camera;sc.left=-3;sc.right=3;sc.top=3;sc.bottom=-3;sc.near=1;sc.far=25;key.shadow.bias=-.0008;S.add(key);
var rim=new THREE.DirectionalLight(0x7fe0ff,.9);rim.position.set(-5,4,-6);S.add(rim);
add(S,cyl(1.6,1.8,.25,48),vio,0,-.125,0);flat(add(S,tor(1.6,.06,48),gold,0,0,0));
var rune=flat(add(S,tor(1.3,.03,48),M(0x2bd4c8,{emissive:0x2bd4c8,emissiveIntensity:1.5}),0,.012,0));glow(S,0,.05,0,4.2,0x2bd4c8,.28);
var M3=[mkOrig(),mkCask(),mkBula()];M3.forEach(function(m){S.add(m.g)});
var NB=40,bp=new Float32Array(NB*3),bs=[];for(var i=0;i<NB;i++){var a=rnd()*6.28,r=2.4+rnd()*3;bp[i*3]=Math.cos(a)*r;bp[i*3+1]=rr(-.5,6);bp[i*3+2]=Math.sin(a)*r-1;bs.push(rr(.2,.6))}

/* ---------- stare, UI ---------- */
var cur=2,act={n:'',t:0,b:false},T=0;
var CAP=['<b>Varianta din randare.</b> Corp crem, cască și ochelari de aviator, rucsac, eșarfă violetă. Se potrivea insulei din nori; în orașul din bulă, ochelarii nu mai au o poveste.',
 '<b>Aceeași mascotă, cu cască de bulă.</b> Păstrezi corpul crem și eșarfa din randare, dar ochelarii devin un dom de sticlă, în ton cu globul. Schimbi cel mai puțin.',
 '<b>Mascota ca bulă vie.</b> Corp perlat, cu un miez luminos și o față mică înăuntru. Atinge-o: face „pop” în scântei și se reface, ca în Buble Blast.'];
var V={th:.35,ph:1.4,z:1,zs:false};

function pick(i){cur=i;M3.forEach(function(m,k){m.g.visible=(k==i);$('v'+k).setAttribute('aria-pressed',k==i)});$('cap').innerHTML=CAP[i];$('aP').hidden=(i!=2);act.n='';pm.opacity=0}
[0,1,2].forEach(function(k){$('v'+k).onclick=function(){pick(k)}});
$('aW').onclick=function(){play('wave')};$('aJ').onclick=function(){play('joy')};$('aP').onclick=function(){play('pop')};
$('aS').onclick=function(){V.zs=!V.zs;V.z=V.zs?3.3:1;$('aS').setAttribute('aria-pressed',V.zs)};
pick(2);
var P={},pc=0,idle=0,pd=0,down=null,rc=new THREE.Raycaster(),cv=$('c');
function pdist(){var k=Object.keys(P);return Math.hypot(P[k[0]][0]-P[k[1]][0],P[k[0]][1]-P[k[1]][1])}
cv.addEventListener('pointerdown',function(e){try{cv.setPointerCapture(e.pointerId)}catch(x){}if(!P[e.pointerId])pc++;P[e.pointerId]=[e.clientX,e.clientY];idle=0;if(pc==1)down=[e.clientX,e.clientY,0];if(pc==2){pd=pdist();down=null}});

 if(pc==1){V.th-=dx*.007;V.ph=Math.max(.9,Math.min(1.75,V.ph-dy*.004));if(down)down[2]+=Math.abs(dx)+Math.abs(dy)}

 if(tap){rc.setFromCamera(new THREE.Vector2(e.clientX/window.innerWidth*2-1,-(e.clientY/window.innerHeight)*2+1),cam);var h=rc.intersectObject(M3[cur].g,true);if(h.length)play(cur==2?'pop':'joy')}
 down=null}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();V.z=Math.max(.5,Math.min(4,V.z*(1+e.deltaY*.001)))},{passive:false});

/* ---------- buclă ---------- */
var last=performance.now(),tgt=new THREE.Vector3(0,.5,0);
function easeBack(u){var t=u-1;return 1+2.7*t*t*t+1.7*t*t}
function loop(now){var dt=Math.min((now-last)/1000,.05);last=now;T+=dt;idle+=dt;act.t+=dt;
 fresMats.forEach(function(m){m.uniforms.t.value=T*.5*K});
 var m=M3[cur],g=m.g;g.visible=true;g.position.y=0;g.rotation.set(0,0,0);
 var br=Math.sin(T*2.2)*.02*K;g.scale.set(1-br*.5,1+br,1-br*.5);
 var bt=T%3.4,bl=bt<.12?1-Math.sin(bt/.12*Math.PI)*.9:1;m.eyes.forEach(function(e){e.scale.y=bl});
 if(m.arms){m.arms[1].rotation.z=-.6;m.arms[-1].rotation.z=.6}
 if(m.core){m.core.rotation.y=T*1.2;var cs=1+Math.sin(T*3)*.1*K;m.core.scale.set(cs,cs,cs)}
 if(act.n=='joy'){var u=act.t/.95;if(u>=1)act.n='';else{g.position.y=4*u*(1-u)*.9;g.rotation.y=u*Math.PI*2;var sq=1-.18*Math.max(0,1-u*7);g.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq))}}
 else if(act.n=='wave'){var w=act.t/2.2;if(w>=1)act.n='';else if(m.arms)m.arms[1].rotation.z=m.wave+Math.sin(act.t*9)*.3;else g.rotation.z=Math.sin(act.t*7)*.12}
 else if(act.n=='pop'){var p=act.t;
  if(p<.12){var s2=1+p/.12*.18;g.scale.set(s2,s2,s2)}
  else if(p<1){g.visible=false;if(!act.b){act.b=true;burst()}pm.opacity=Math.max(0,1-(p-.12)/.85)}
  else if(p<1.9){pm.opacity=0;var s3=Math.max(0,easeBack((p-1)/.9));g.scale.set(s3,s3,s3)}
  else act.n=''}
 if(act.n=='pop'&&act.b){for(var i=0;i<NP;i++){pp[i*3]+=pv[i*3]*dt;pp[i*3+1]+=pv[i*3+1]*dt;pp[i*3+2]+=pv[i*3+2]*dt;pv[i*3]*=.97;pv[i*3+1]*=.97;pv[i*3+2]*=.97}pg.attributes.position.needsUpdate=true}
 var ba=bgeo.attributes.position.array;for(var k=0;k<NB;k++){ba[k*3+1]+=bs[k]*dt*K;if(ba[k*3+1]>6)ba[k*3+1]=-.5}bgeo.attributes.position.needsUpdate=true;
 rune.material.emissiveIntensity=1.2+Math.sin(T*2)*.4*K;

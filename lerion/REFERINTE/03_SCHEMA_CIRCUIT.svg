<text x="500" y="184" font-size="18" text-anchor="middle" font-family="Arial" fill="#75553b">existent, în fundal</text>
<!-- six building pads outside game loop -->
<g font-family="Arial" font-weight="bold" font-size="23" text-anchor="middle">
<rect x="72" y="272" width="215" height="110" rx="40" fill="#a9d5e7" stroke="#4c7c96" stroke-width="6"/><text x="180" y="320" fill="#173c54">MINĂ</text><text x="180" y="350" fill="#173c54" font-size="17">stânga sus</text>
<rect x="713" y="272" width="215" height="110" rx="40" fill="#e7d6ae" stroke="#b69a60" stroke-width="6"/><text x="820" y="320" fill="#59411c">MOARĂ</text><text x="820" y="350" fill="#59411c" font-size="17">dreapta sus</text>
<rect x="72" y="542" width="215" height="110" rx="40" fill="#f6bfba" stroke="#b66f6b" stroke-width="6"/><text x="180" y="590" fill="#5c2d2a">ATELIER</text><text x="180" y="620" fill="#5c2d2a" font-size="17">Pongo</text>

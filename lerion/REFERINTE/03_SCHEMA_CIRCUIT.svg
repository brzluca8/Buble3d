<rect x="72" y="822" width="215" height="110" rx="40" fill="#ffdcb7" stroke="#d79f5d" stroke-width="6"/><text x="180" y="870" fill="#683d1c">PIAȚĂ</text><text x="180" y="900" fill="#683d1c" font-size="17">stânga jos</text>
